<section class="auth-panel">
  <div class="intro">
    <p class="eyebrow">Create account</p>
    <h1>Join as a founder or buyer</h1>
    <p>Founders list products. Buyers discover solutions and submit qualified leads.</p>
  </div>

  <form class="form" (ngSubmit)="submit()">
    <label>
      Username
      <input name="username" [(ngModel)]="form.username" autocomplete="username" required />
    </label>

    <label>
      Password
      <input
        name="password"
        type="password"
        [(ngModel)]="form.password"
        autocomplete="new-password"
        minlength="8"
        required
      />
    </label>

    <label>
      Role
      <select name="role" [(ngModel)]="form.role">
        <option value="buyer">Buyer</option>
        <option value="founder">Founder</option>
      </select>
    </label>

    <label>
      LinkedIn
      <input name="linkedin_profile" [(ngModel)]="form.linkedin_profile" placeholder="https://linkedin.com/in/..." />
    </label>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Creating...' : 'Register' }}
    </button>

    <p class="switch">Already have an account? <a routerLink="/login">Login</a></p>
  </form>
</section>
